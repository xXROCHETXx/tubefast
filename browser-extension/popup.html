<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tubefast Connect</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <div class="brand"><span class="mark">◉</span> TUBEFAST CONNECT</div>
    <h1>Tu música,<br>ya conectada.</h1>
    <p>Usa la cuenta de YouTube que tienes abierta en este navegador.</p>
    <button id="connect" type="button">Conectar con Tubefast</button>
    <div id="status" role="status" aria-live="polite">En Tubefast, pulsa Sign in → Continue in browser.</div>
    <button class="secondary" id="youtube" type="button">Abrir YouTube Music</button>
    <footer>La sesión se envía solo a Tubefast en este equipo, cuando pulsas Conectar.</footer>
  </main>
  <script src="popup.js"></script>
</body></html>
